<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson 19 - Signup form with validation (solution)</title>
    <link rel="stylesheet" href="solution.css" />
  </head>
  <body>
    <main class="card">
      <h1>Create your account</h1>

      <!-- novalidate keeps the native bubbles off so our inline
           messages are the single source of feedback. -->
      <form id="signup" method="post" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            autocomplete="name"
            required
            aria-describedby="name-error"
          />
          <p class="field-error" id="name-error" hidden></p>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
            aria-describedby="email-error"
          />
          <p class="field-error" id="email-error" hidden></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="new-password"
            required
            minlength="8"
            aria-describedby="password-error"
          />
          <p class="field-error" id="password-error" hidden></p>
        </div>

        <button type="submit">Create account</button>

        <p class="success" id="success" hidden>Account created. Welcome aboard!</p>
      </form>
    </main>

    <script src="solution.js"></script>
  </body>
</html>
