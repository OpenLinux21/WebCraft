<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson 19 - Signup form with validation</title>
    <link rel="stylesheet" href="starter.css" />
  </head>
  <body>
    <main class="card">
      <h1>Create your account</h1>

      <!-- TODO: add the novalidate attribute to this form so the
           browser's default error bubbles stay out of the way. -->
      <form id="signup" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <!-- TODO: this input should be required and should point at
               its error paragraph with aria-describedby="name-error". -->
          <input type="text" id="name" name="name" autocomplete="name" />
          <p class="field-error" id="name-error" hidden></p>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <!-- TODO: set type="email", add required, and add
               aria-describedby="email-error". -->
          <input type="text" id="email" name="email" autocomplete="email" />
          <p class="field-error" id="email-error" hidden></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <!-- TODO: add required, minlength="8", and
               aria-describedby="password-error". -->
          <input type="password" id="password" name="password" autocomplete="new-password" />
          <p class="field-error" id="password-error" hidden></p>
        </div>

        <button type="submit">Create account</button>

        <p class="success" id="success" hidden>Account created. Welcome aboard!</p>
      </form>
    </main>

    <script src="starter.js"></script>
  </body>
</html>
