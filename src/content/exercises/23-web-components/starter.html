<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson 23 - Build the color-chip element</title>
    <link rel="stylesheet" href="starter.css" />
  </head>
  <body>
    <main class="page">
      <h1>Palette</h1>
      <p>
        Each swatch below is a <code>&lt;color-chip&gt;</code> custom element. The class that brings
        them to life is yours to write in <code>starter.js</code>.
      </p>

      <!-- TODO in JS: these three chips stay empty until you define the
           element. Configure it through attributes: hex (required) and
           label (optional - no label means the hex is shown instead). -->
      <ul class="palette">
        <li><color-chip hex="#7c4dff" label="Violet"></color-chip></li>
        <li><color-chip hex="#00897b" label="Teal"></color-chip></li>
        <li><color-chip hex="#ef6c00"></color-chip></li>
      </ul>

      <p class="note">
        Note: the chip's swatch and caption styles must live inside the element's shadow root. Page
        CSS like this file cannot cross the shadow boundary.
      </p>
    </main>

    <script src="starter.js"></script>
  </body>
</html>
