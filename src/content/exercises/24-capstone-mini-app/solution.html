<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Task board</title>
  </head>
  <body>
    <main>
      <h1>Task board</h1>
      <form id="task-form">
        <label for="task-input">New task</label>
        <input type="text" id="task-input" required placeholder="What needs doing?" />
        <button type="submit">Add</button>
      </form>
      <p id="task-count" role="status"></p>
      <ul id="task-list"></ul>
    </main>
    <script src="solution.js"></script>
  </body>
</html>
